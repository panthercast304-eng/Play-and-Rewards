<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Plus For You</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
 body{max-width:720px;margin:0 auto}
 table{width:100%;border-collapse:collapse;margin-top:10px}
 td,th{padding:8px;border-bottom:1px solid #2b2139;text-align:left;font-size:13px}
 .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .stat-box{background:#191324;border:1px solid var(--border);border-radius:12px;padding:14px}
 .stat-box b{font-size:22px;display:block}
 button.small{padding:6px 10px;font-size:11px;border-radius:8px;margin-right:4px}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar"><h1>Admin Dashboard</h1></header>
<main>
<section id="login" class="card auth-card">
  <h2>Admin login</h2>
  <input id="email" type="email" placeholder="Admin email">
  <input id="password" type="password" placeholder="Password">
  <button class="primary wide" id="go">Login</button>
  <p id="msg" class="message"></p>
</section>

<section id="dash" hidden>
  <div class="card"><div class="stat-grid" id="stats"></div></div>
  <div class="card">
    <h3>Withdrawal requests</h3>
    <table id="wtable"><thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table>
  </div>
</section>
</main>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
window.onerror=function(msg,src,line,col,err){
  document.getElementById("msg").textContent="Page error: "+msg+" (line "+line+")";
};
window.addEventListener("unhandledrejection",function(e){
  document.getElementById("msg").textContent="Promise error: "+(e.reason&&e.reason.message?e.reason.message:e.reason);
});
</script>
<script>
const $=id=>document.getElementById(id);
const sb=supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

$("go").onclick=async()=>{
  $("msg").textContent="";
  const e=$("email").value.trim(), p=$("password").value;
  const {error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error){$("msg").textContent=error.message;return}
  const {data:who,error:whoErr}=await sb.rpc("debug_whoami");
  if(whoErr){$("msg").textContent="whoami error: "+whoErr.message;}
  else if(who && who[0]){$("msg").textContent="Logged in as "+who[0].my_email+" | admin flag seen as: "+who[0].is_admin_flag;}
  else{$("msg").textContent="whoami returned no rows.";}
  load();
};

async function load(){
  const {data:stats,error}=await sb.rpc("get_stats");
  if(error){$("msg").textContent+=" | get_stats: "+error.message;return}
  $("login").hidden=true; $("dash").hidden=false;
  const s=stats[0];
  $("stats").innerHTML=`
    <div class="stat-box"><span class="muted">Total Users</span><b>${s.total_users}</b></div>
    <div class="stat-box"><span class="muted">Coins In Circulation</span><b>${s.total_coins_issued.toLocaleString()}</b></div>
    <div class="stat-box"><span class="muted">Total Ads Watched</span><b>${s.total_ads_watched.toLocaleString()}</b></div>
    <div class="stat-box"><span class="muted">Pending Withdrawals</span><b>${s.total_withdrawals_pending}</b></div>
    <div class="stat-box" style="grid-column:1/3"><span class="muted">Coins Pending Payout</span><b>${s.total_coins_pending_withdrawal.toLocaleString()} ≈ ₹${(s.total_coins_pending_withdrawal/10).toFixed(2)}</b></div>
  `;
  loadWithdrawals();
}

async function loadWithdrawals(){
  const {data,error}=await sb.rpc("admin_list_withdrawals");
  const tbody=document.querySelector("#wtable tbody"); tbody.innerHTML="";
  if(error||!data||!data.length){tbody.innerHTML=`<tr><td colspan="5" class="muted">No withdrawal requests yet.</td></tr>`;return}
  data.forEach(w=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${w.username}</td><td>${w.amount.toLocaleString()}</td><td>${w.method}<br><small>${w.upi_id||""}</small></td><td>${w.status}</td><td></td>`;
    const actionTd=tr.lastElementChild;
    if(w.status==="pending review"){
      const approve=document.createElement("button"); approve.className="primary small"; approve.textContent="Mark Paid";
      approve.onclick=async()=>{await sb.rpc("admin_update_withdrawal",{p_id:w.id,p_status:"paid"});loadWithdrawals();load();};
      const reject=document.createElement("button"); reject.className="secondary small"; reject.textContent="Reject";
      reject.onclick=async()=>{await sb.rpc("admin_update_withdrawal",{p_id:w.id,p_status:"rejected"});loadWithdrawals();load();};
      actionTd.append(approve,reject);
    }
    tbody.appendChild(tr);
  });
}

sb.auth.getSession().then(({data})=>{ if(data.session) load(); });
</script>
</body>
</html>
